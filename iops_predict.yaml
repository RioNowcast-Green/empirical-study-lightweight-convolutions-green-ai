benchmark:
  name: "STMixGAN Prediction"
  workdir: "./"
  cache_file: "./cache_predict.db"
  cache_exclude_vars: ["results_dir", "weight_file", "project_dir"] 
  executor: slurm
  search_method: exhaustive
  repetitions: 4
  parallel: 2
  probes:
    system_snapshot: true
    resource_sampling: true
    gpu_sampling: true
    sampling_interval: 1.0

vars:
  light_conv:
    type: str
    sweep:
      mode: list
      values: ["standard", "dwsb", "sqnxt", "fire", "tied", "global", "dws"]

  dataset:
    type: str
    sweep:
      mode: list
      values: ["moving_mnist", "taasrad19"]

  project_dir:
    type: str
    expr: "/home/<some-user>/st-mix-gan-main"

  results_dir:
    type: str
    expr: "{{ execution_dir }}/experiments_results"

  weight_file:
    type: str
    expr: "{{ results_dir }}/training_{{ dataset }}_{{ light_conv }}_{{ repetition }}/weights/generator/{{ dataset }}_stmixnet_{{ light_conv }}_100.pth"

command:
  template: >
    python {{ project_dir }}/predictor.py
    --model_weight_file_path {{ weight_file }}
    --working_dir {{ results_dir }}
    --normalize_values
    --light_conv {{ light_conv }}
    --dataset {{ dataset }}
    --result_folder_suffix {{ repetition }}
    --skip_run_evaluation

scripts:
  - name: "stmixgan_predict"
    submit: "bash"
    script_template: |
      #!/bin/bash
      #SBATCH --job-name=stmixgan_pred_{{ light_conv }}_{{ dataset }}
      #SBATCH --ntasks=1
      #SBATCH --nodes=1
      #SBATCH --ntasks-per-node=1
      #SBATCH --nodelist=sirocco[22-25]
      #SBATCH --time=24:00:00
      #SBATCH -o batch%j.out
      #SBATCH -e batch%j.err
      #SBATCH --exclusive
      #SBATCH --constraint sirocco

      module load compiler/cuda/12.3

      eval "$(conda shell.bash hook)"
      conda activate iops_dev

      module add compiler/gcc/11.2.0
      module add linalg/openblas/0.3.9 
      
      {{ command.template }} 2>&1 | tee {{ execution_dir }}/predict.log

    parser:
      file: "{{ results_dir }}/predict_{{ dataset }}_{{ light_conv }}_{{ repetition }}/metrics/execution_metrics_predict_{{ light_conv }}_{{ dataset }}.csv"
      metrics:
        - name: total_predict_time_sec
      parser_script: |
        import csv
        import os
        def parse(file_path):
            # Parse execution metrics
            with open(file_path) as f:
                reader = csv.DictReader(f)
                exec_row = next(reader)

            results = {
                "total_predict_time_sec": float(exec_row["total_predict_time_sec"]),
            }

            return results

output:
  sink:
    type: csv
